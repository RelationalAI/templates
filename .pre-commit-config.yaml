repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.1
    hooks:
      - id: ruff-check
        name: Ruff lint (templates)
        files: ^(sample-template|scripts|tests|[^/.][^/]*)/.*\.py$

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml

  - repo: local
    hooks:
      - id: verify-template-index
        name: Verify root template index
        entry: python scripts/generate_template_index.py --check
        language: python
        pass_filenames: false
        additional_dependencies:
          - PyYAML==6.0.2
        files: ^(README\.md|[^/.][^/]*/README\.md|scripts/generate_template_index\.py)$
