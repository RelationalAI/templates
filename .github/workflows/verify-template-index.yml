name: Verify template index

on:
  pull_request:
    paths:
      - "README.md"
      - "*/README.md"
      - "scripts/generate_template_index.py"
      - "requirements-dev.txt"
      - ".github/workflows/verify-template-index.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check generated template index
        run: python scripts/generate_template_index.py --check
