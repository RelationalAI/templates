name: Verify version indexes

on:
  pull_request:
    paths:
      - "v*/**/README.md"
      - "scripts/generate_version_indexes.py"
      - "requirements-dev.txt"
      - ".github/workflows/verify-version-indexes.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check generated version indexes
        run: python scripts/generate_version_indexes.py --check
