model_explorer:
  title: Explore the model
  description: >-
    The model represents raw policy records, accepted and review-band matches,
    and the resolved insured parties used for accumulation control. Accepted
    matches create graph edges, while party membership carries each policy's
    coverage into the resolved exposure.

  concepts:
    - symbol: Record
      description: A policyholder record and its coverage from one source system.

    - symbol: CandidateMatch
      description: A scored record pair accepted for automatic resolution.

    - symbol: ReviewPair
      description: A possible match held for a steward instead of being merged.

    - symbol: ResolvedParty
      description: An insured party formed by clustering accepted record matches.

  relationships:
    - symbol: CandidateMatch.rec_a
      label: accepts first record
      reading: CandidateMatch accepts a first Record
      description: Identifies one endpoint of an accepted match edge.

    - symbol: CandidateMatch.rec_b
      label: accepts second record
      reading: CandidateMatch accepts a second Record
      description: Identifies the other endpoint of an accepted match edge.

    - symbol: ReviewPair.rec_a
      label: reviews first record
      reading: ReviewPair holds a first Record for review
      description: Identifies one endpoint of a possible match awaiting review.

    - symbol: ReviewPair.rec_b
      label: reviews second record
      reading: ReviewPair holds a second Record for review
      description: Identifies the other endpoint of a possible match awaiting review.

    - symbol: Record.resolved_party
      label: contributes exposure to
      reading: Record contributes exposure to ResolvedParty
      description: >-
        Connects each record to its resolved party so policy coverage can be
        aggregated into total exposure.

  sources:
    - path: data/records.csv
      description: >-
        Dirty policyholder records, matching identifiers, source systems, and
        per-policy coverage.

guided_walkthrough:
  title: See how it works
  description: >-
    Trace source records from candidate facts to resolved exposure and
    reinsurance decisions.

  steps:
    - id: prepare-candidate-facts
      title: Prepare candidate facts
      explanation: >-
        match_data loads accepted pairs as model facts. review_data keeps
        uncertain pairs separate for review.
      focus:
        file: model/source.py
        anchors:
          - start: match_data = model.data(matches)
            end: match_data = model.data(matches)
          - start: review_data = model.data(reviews)
            end: review_data = model.data(reviews)
      references:
        match_data:
          symbol: match_data
        review_data:
          symbol: review_data
      links:
        - title: Declare data sources
          href: /build/guides/modeling/declare-data-sources/
        - title: Define base facts
          href: /build/guides/modeling/define-base-facts/

    - id: resolve-parties-and-exposure
      title: Resolve parties and exposure
      explanation: >-
        graph.Node.entity_id groups accepted links into parties.
        records_per_entity marks duplicates, and party_record rolls policy
        coverage into party exposure.
      focus:
        file: entity_resolution.py
        anchors:
          - start: graph.Node.entity_id = graph.weakly_connected_component()
            end: graph.Node.entity_id = graph.weakly_connected_component()
          - start: records_per_entity = aggregates.count
            end: records_per_entity = aggregates.count
          - start: party_record = Record.ref()
            end: party_record = Record.ref()
      references:
        graph.Node.entity_id:
          symbol: graph.Node.entity_id
        records_per_entity:
          symbol: records_per_entity
        party_record:
          symbol: party_record
      links:
        - title: Run a graph algorithm
          href: /build/guides/reasoning/graph/run-an-algorithm/
        - title: Aggregate and group data
          href: /build/guides/reasoning/rules-based/aggregate-and-group-data/

