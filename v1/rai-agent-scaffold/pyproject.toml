[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-template-rai-agent-scaffold"
version = "0.0.0"
description = "RelationalAI template: rai-agent-scaffold (PyRel v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "relationalai==1.0.14",
  "httpx",
  "pyyaml",
  "snowflake-snowpark-python",
]

[tool.setuptools]
packages = []
