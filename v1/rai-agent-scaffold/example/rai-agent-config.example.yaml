# Copy this file to the parent directory as rai-agent-config.yaml and fill in your values.
# rai-agent-config.yaml is gitignored — this file is the checked-in template.

agent:
  name: EMPLOYEE_DIRECTORY_AGENT    # Name shown in Snowflake Cortex Agents UI
  database: MY_DATABASE             # Snowflake database to deploy into
  schema: MY_SCHEMA                 # Schema to deploy into (must already exist)
  warehouse: MY_WAREHOUSE           # Warehouse for sproc execution
  model_name: EMPLOYEE_DIRECTORY    # RAI Model name used internally in each sproc

model:
  source_table: MY_DB.MY_SCHEMA.EMPLOYEES  # Fully-qualified EMPLOYEES table
