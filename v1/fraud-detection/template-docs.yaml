version: 1

page:
  lead_from_readme:
    - what-this-template-is-for
  omit_from_readme:
    - sample-data
    - model-overview
    - how-it-works

model_explorer:
  title: Explore the model
  description: >-
    Accounts send and receive transactions. The same connections support
    account-level graph signals, transaction-level fraud predictions, and the
    budget-constrained investigation queue.

  concepts:
    - symbol: Account
      description: A customer or merchant account in the funds-flow network.

    - symbol: Transaction
      description: A transfer whose attributes and graph context inform its fraud score.

  relationships:
    - symbol: Transaction.sender
      label: sent by
      reading: Transaction is sent by Account
      description: Connects each transfer to the account that originated it.

    - symbol: Transaction.receiver
      label: received by
      reading: Transaction is received by Account
      description: Connects each transfer to the account that received it.

  sources:
    - path: data/paysim_mini/accounts.csv
      description: Customer and merchant account identifiers and type prefixes.
      populates:
        - Account

    - path: data/paysim_mini/transactions.csv
      description: Transaction amounts, balances, endpoints, timestamps, and heuristic flags.
      populates:
        - Transaction
        - Transaction.sender
        - Transaction.receiver

    - path: data/paysim_mini/train.csv
      description: Labeled transactions used to train the fraud classifier.
      populates:
        - Transaction

    - path: data/paysim_mini/val.csv
      description: Labeled transactions used to validate the fraud classifier.
      populates:
        - Transaction

    - path: data/paysim_mini/test.csv
      description: Unlabeled transactions scored for investigation.
      populates:
        - Transaction

guided_walkthrough:
  title: See how it works
  description: >-
    Trace transaction data from the shared model to fraud signals and a
    budget-feasible investigation queue.

  steps:
    - id: load-and-map-transactions
      title: Load and map transactions
      explanation: >-
        accounts_df and transactions_df load the funds-flow network. train_df
        starts the task splits used to learn fraud.
      focus:
        file: model/source.py
        anchors:
          - start: accounts_df = read_csv
            end: transactions_df = read_csv
          - start: train_df = read_csv
            end: test_df = read_csv
          - start: model.define(Account.new(model.data(accounts_df).to_schema()))
            end: model.define(Transaction.new(model.data(transactions_df).to_schema()))
      references:
        accounts_df:
          symbol: accounts_df
        transactions_df:
          symbol: transactions_df
        train_df:
          symbol: train_df
      links:
        - title: Declare data sources
          href: /build/guides/modeling/declare-data-sources/
        - title: Define base facts
          href: /build/guides/modeling/define-base-facts/

    - id: derive-fraud-signals
      title: Derive fraud signals
      explanation: >-
        Account.pagerank and Account.activity_count enrich the network context.
        Transaction.predictions turns those signals into fraud probabilities.
      focus:
        file: fraud_detection_local.py
        anchors:
          - start: pagerank_rel = acct_graph.pagerank()
            end: Account.pagerank = model.Property
          - start: Account.activity_count = model.Property
            end: f"{Account} has {Integer:activity_count}")
          - start: _report(gnn, "fraud_gnn")
            end: Transaction.predictions = gnn.predictions(domain=Test)
      references:
        Account.pagerank:
          symbol: Account.pagerank
        Account.activity_count:
          symbol: Account.activity_count
        Transaction.predictions:
          symbol: Transaction.predictions
      links:
        - title: Run a graph algorithm
          href: /build/guides/reasoning/graph/run-an-algorithm/
        - title: Solve a classification problem
          href: /build/guides/reasoning/predictive/solve-a-classification-problem/

    - id: allocate-investigation-capacity
      title: Allocate investigation capacity
      explanation: >-
        problem turns each Transaction.x_audit choice into a budgeted
        allocation. A budget constraint limits investigator hours before the
        model prioritizes the queue.
      focus:
        file: fraud_detection_local.py
        anchors:
          - start: problem = Problem(model, Float)
            end: problem = Problem(model, Float)
          - start: Transaction.x_audit = model.Property
            end: f"{Transaction} audited as {Float:x}")
          - start: "# Constraint: total investigator hours <= budget"
            end: sum(Txn_ref, Txn_ref.audit_cost * select_ref) <= AUDIT_BUDGET_HOURS
      references:
        problem:
          symbol: problem
        Transaction.x_audit:
          symbol: Transaction.x_audit
      links:
        - title: Add constraints
          href: /build/guides/reasoning/prescriptive/decision-problems/constraints/
        - title: Inspect solutions
          href: /build/guides/reasoning/prescriptive/decision-problems/solutions/
