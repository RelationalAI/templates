# Proposed v1 sidecar for v1/portfolio_balancing/template-docs.yaml.
#
# README.md remains authoritative for the page title, description, problem
# statement, prerequisites, quickstart, expected output, customization, and
# troubleshooting. The docs build derives identities, properties, source
# mappings, row counts, and line ranges from the referenced files.

version: 1

page:
  lead_from_readme:
    - what-this-template-is-for
  omit_from_readme:
    - sample-data
    - model-overview
    - how-it-works

model_explorer:
  title: Explore the model
  description: >-
    The model connects investors and their accounts to holdings, stocks,
    sectors, and transactions. Rules inspect the current portfolio, graph
    reasoning groups correlated stocks, and prescriptive reasoning chooses
    a re-balanced portfolio.

  # List order controls the reading order. Identity keys and properties are
  # extracted from model/schema.py and are not repeated here.
  concepts:
    - symbol: User
      description: An investor whose accounts and activity are evaluated.

    - symbol: Account
      description: A brokerage or retirement account owned by an investor.

    - symbol: Holding
      description: A stock position held in an account.

    - symbol: Transaction
      description: An investor transaction used by the compliance rules.

    - symbol: Stock
      description: An investable security with expected return and covariance data.

    - symbol: Sector
      description: A market sector used to measure and constrain concentration.

  # Endpoints are extracted from the schema expression. The author supplies
  # the business reading and explanation.
  relationships:
    - symbol: Account.user
      label: owned by
      reading: Account is owned by User
      description: Connects each account to the investor who owns it.

    - symbol: Holding.account
      label: held in
      reading: Holding is held in Account
      description: Connects a position to the account that contains it.

    - symbol: Holding.stock
      label: position in
      reading: Holding is a position in Stock
      description: Connects a position to the security it represents.

    - symbol: Stock.sector_ref
      label: belongs to
      reading: Stock belongs to Sector
      description: Groups stocks for sector exposure checks and constraints.

    - symbol: Transaction.user
      label: made by
      reading: Transaction was made by User
      description: Connects activity to the investor evaluated by compliance rules.

  sources:
    # The extractor validates these paths and infers which model items they
    # populate from model/source.py. A populates override is allowed only when
    # the mapping is dynamic or ambiguous.
    - path: data/users.csv
      description: Investor names and risk scores.

    - path: data/accounts.csv
      description: Account ownership, type, and balance.

    - path: data/holdings.csv
      description: Current stock positions by account.

    - path: data/transactions.csv
      description: Investor transactions and existing flagged indicators.

    - path: data/returns.csv
      description: Stock identifiers, sectors, and expected returns.

    - path: data/covar.csv
      description: Pairwise stock covariance values.
      populates:
        - Stock

guided_walkthrough:
  title: See how it works
  description: >-
    Trace the shared portfolio model from connected facts to compliance
    checks, correlation groups, and a re-balanced allocation.

  steps:
    - id: connect-portfolio-model
      title: Connect the portfolio model
      explanation: >-
        Account identifies each account. Account.user and Holding.account
        connect it to the investor and positions.
      focus:
        file: model/schema.py
        anchors:
          - start: Account = model.Concept
            end: Account.user = model.Relationship
          - start: Holding.purchase_price = model.Property
            end: Holding.stock = model.Relationship
      references:
        Account:
          symbol: Account
        Account.user:
          symbol: Account.user
        Holding.account:
          symbol: Holding.account
      links:
        - title: Declare concepts
          href: /build/guides/modeling/declare-concepts/
        - title: Declare relationships and properties
          href: /build/guides/modeling/declare-relationships-and-properties/

    - id: load-portfolio-and-market-facts
      title: Load portfolio and market facts
      explanation: >-
        covar_data adds market facts, and user_data starts the portfolio
        mapping. The same module adds accounts, holdings, and transactions.
      focus:
        file: model/source.py
        anchors:
          - start: returns_csv = read_csv
            end: covar_data = model.data(covar_csv)
          - start: user_data = model.data
            end: user.risk_score(user_data["risk_score"]),
      references:
        covar_data:
          symbol: covar_data
        user_data:
          symbol: user_data
      links:
        - title: Declare data sources
          href: /build/guides/modeling/declare-data-sources/
        - title: Define base facts
          href: /build/guides/modeling/define-base-facts/

    - id: flag-cluster-and-rebalance
      title: Flag, cluster, and re-balance
      explanation: >-
        Holding.is_overconcentrated flags compliance risk, community groups
        correlated stocks, and Stock.x_quantity carries the re-balanced allocation.
      focus:
        file: portfolio_balancing.py
        anchors:
          - start: Holding.is_overconcentrated = model.Relationship
            end: ").define(Holding.is_overconcentrated())"
          - start: community = corr_graph.louvain()
            end: community(stock_clust_ref, cluster_label)
          - start: Stock.x_quantity = model.Property
            end: PairedStock = Stock.ref()
      references:
        Holding.is_overconcentrated:
          symbol: Holding.is_overconcentrated
        community:
          symbol: community
        Stock.x_quantity:
          symbol: Stock.x_quantity
      links:
        - title: Rules-based reasoning
          href: /build/guides/reasoning/rules-based/
        - title: Solve a decision problem
          href: /build/guides/reasoning/prescriptive/decision-problems/solve/

sample_data:
  default_rows: 4
  tables:
    # Table order is editorial. For this template, transactions intentionally
    # appear before returns and covariance, matching the meeting decision.
    - path: data/users.csv
      title: Investors
      description: Investor profiles and risk scores used by compliance rules.
      columns:
        - id
        - name
        - risk_score

    - path: data/accounts.csv
      title: Accounts
      description: Account ownership, type, and balance.
      columns:
        - id
        - user_id
        - account_type
        - balance

    - path: data/holdings.csv
      title: Holdings
      description: Current positions that the rules inspect and the optimizer replaces.
      columns:
        - id
        - account_id
        - stock_id
        - quantity
        - purchase_price

    - path: data/transactions.csv
      title: Transactions
      description: Activity and flagged indicators used to identify high-risk traders.
      columns:
        - id
        - user_id
        - amount
        - category
        - is_flagged

    - path: data/returns.csv
      title: Expected returns
      description: The stock universe, sectors, and expected returns.
      columns:
        - index
        - ticker
        - sector
        - returns

    - path: data/covar.csv
      title: Covariance
      description: Pairwise covariance values used for clustering and portfolio risk.
      columns:
        - i
        - j
        - covar
