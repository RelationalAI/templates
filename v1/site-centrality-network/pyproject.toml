[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rai-template-site-centrality-network"
version = "0.0.0"
description = "RelationalAI template: supply chain site criticality with WCC, bridge detection, and eigenvector centrality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "relationalai>=1.0.3",
  "pandas>=2.0.0",
]

[tool.setuptools]
packages = []
