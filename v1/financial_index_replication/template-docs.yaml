    - id: limit-sector-and-trades
      title: Keep sector exposure and trades within limits
      explanation: |-
        Matching past index returns is not enough if the basket concentrates
        in one sector or calls for large trades. SECTOR_ACTIVE_BAND keeps each
        sector’s share of the portfolio within four percentage points of that
        sector’s share of the index.

        MAX_ADV_PARTICIPATION compares each proposed buy or sell with the
        stock’s average daily trading value and caps the trade at 5% of that
        value. These constraints keep the sector mix near the index while
        limiting the trades needed to move from the previous portfolio.
      focus:
        file: financial_index_replication.py
        anchors:
          - start: '# Keep sector exposures close to benchmark sector weights.'
            end: PORTFOLIO_VALUE * (Stock.previous_weight - weight)
            end_offset: 3
      references:
