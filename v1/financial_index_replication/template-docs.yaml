    - id: require-complete-basket
      title: Select 20 stocks and allocate the portfolio
      explanation: |-
        The sample index contains 50 stocks, but the model aims to follow the
        index with a smaller basket. sum(selected) == N_REPLICATION_NAMES
        marks 20 of those stocks as selected, and sum(weight) == 1.0 makes
        the portfolio weights add to 100%.

        MAX_WEIGHT * selected prevents investment in unselected stocks and
        caps each selected stock at 10%. These constraints still allow a
        selected stock to have zero weight, so the model may invest in fewer
        than 20 stocks.
      focus:
