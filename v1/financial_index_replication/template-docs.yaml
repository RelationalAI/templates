    - what-this-template-is-for
  omit_from_readme:
    - sample-data
    - model-overview
    - how-it-works

model_explorer:
  title: Explore the model
  description: >-
    The model connects each stock to a sector and records both benchmark and
    stock returns by month. The decision problem uses those facts to select
    and weight a sparse basket that follows the benchmark.

  concepts:
    - symbol: Stock
      description: >-
        One of the 50 stocks the template can hold. Its share of the index and
        monthly returns help compare the smaller portfolio with the benchmark.
        Its previous portfolio weight and average daily trading value help
        limit how much to buy or sell.

    - symbol: Sector
      description: >-
        A group of stocks in one part of the market, such as Technology. The
        template keeps the amount invested in each sector close to that
        sector’s share of the index.

    - symbol: ReturnMonth
      description: >-
        One month of sample returns. It stores the index return and connects
        to each stock’s return for that month, so the template can compare the
        portfolio’s return with the index.

  relationships:
    - symbol: Stock.sector_ref
      label: belongs to
      reading: Stock belongs to Sector
      description: >-
        Connects a stock to its sector. The template adds up the index and
        portfolio weights for stocks in each sector, then limits how far the
        portfolio can differ from the index.

    - symbol: Stock.monthly_return
      label: has a return in
      reading: Stock has a return in ReturnMonth
      description: >-
        Links each stock to one month and records the stock’s return for that
        month. The template weights and adds the stock returns to calculate
        the basket’s monthly return, then compares it with the index return.

  sources:
    - path: data/stocks.csv
      description: >-
        Investable stocks with sectors, benchmark weights, liquidity, and
        previous portfolio weights.
      populates:
        - Stock
        - Sector
        - Stock.sector_ref

    - path: data/index_returns.csv
      description: Monthly returns for the benchmark being replicated.
      populates:
        - ReturnMonth

    - path: data/stock_returns.csv
      description: Monthly returns for each stock in the investable universe.
      populates:
        - Stock.monthly_return

guided_walkthrough:
  title: See how it works
  description: >-
    The Model Explorer shows how stocks belong to sectors and have returns
    for each month. This walkthrough follows those relationships into the
    Python that loads the data, chooses a 20-stock basket within portfolio
    limits, and checks its tracking error. Use the excerpts to find the data
    mappings, limits, and tracking calculation you could adapt for another
    index.

  steps:
    - id: load-stock-return-model
      title: Load stocks and monthly returns into the model
      explanation: |-
        Three CSV files list eligible stocks, monthly index returns, and each
        stock’s monthly returns. pd.read_csv(...) loads each file into a
        DataFrame.

        Stock.new(...) and ReturnMonth.new(...) define base facts from the stock
        and index-return DataFrames. The code groups stocks by sector and uses
        Stock.monthly_return(...) to connect each stock to its monthly return,
        giving the model the history needed to compare a proposed basket’s
        returns with the index.
      focus:
        file: model/source.py
        anchors:
          - start: stocks_csv = pd.read_csv
            end: ReturnMonth.date(stock_return_data.date),
            end_offset: 4
      references:
