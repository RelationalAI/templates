version: 1

page:
  lead_from_readme:
    - what-this-template-is-for
  omit_from_readme:
    - sample-data
    - model-overview
    - how-it-works

model_explorer:
  title: Explore the model
  description: >-
    The model connects each stock to a sector and records both benchmark and
    stock returns by month. The decision problem uses those facts to select
    and weight a sparse basket that follows the benchmark.

  concepts:
    - symbol: Stock
      description: >-
        An investable security with benchmark weight, liquidity, prior weight,
        and a monthly return history.

    - symbol: Sector
      description: >-
        A market sector used to compare the basket's exposure with the
        benchmark.

    - symbol: ReturnDate
      description: >-
        A month in the historical panel with the benchmark return for that
        period.

  relationships:
    - symbol: Stock.sector_ref
      label: belongs to
      reading: Stock belongs to Sector
      description: Groups stocks for benchmark aggregation and sector constraints.

    - symbol: Stock.return_on
      label: returned on
      reading: Stock has a return on ReturnDate
      description: >-
        Connects each stock to a benchmark period and records the stock's
        return for that month.

  sources:
    - path: data/stocks.csv
      description: >-
        Investable stocks with sectors, benchmark weights, liquidity, and
        previous portfolio weights.
      populates:
        - Stock
        - Sector
        - Stock.sector_ref

    - path: data/index_returns.csv
      description: Monthly returns for the benchmark being replicated.
      populates:
        - ReturnDate

    - path: data/stock_returns.csv
      description: Monthly returns for each stock in the investable universe.
      populates:
        - Stock.return_on

guided_walkthrough:
  title: See how it works
  description: >-
    Trace market data from the return model to a constrained replication
    basket and its tracking results.

  steps:
    - id: load-stock-return-model
      title: Load the stock and return model
      explanation: >-
        stocks_csv, index_returns_csv, and stock_returns_csv populate the
        investable universe and aligned return history.
      focus:
        file: model/source.py
        anchors:
          - start: stocks_csv = pd.read_csv
            end: stock_returns_csv = pd.read_csv
      references:
        stocks_csv:
          symbol: stocks_csv
        index_returns_csv:
          symbol: index_returns_csv
        stock_returns_csv:
          symbol: stock_returns_csv
      links:
        - title: Declare data sources
          href: /build/guides/modeling/declare-data-sources/
        - title: Define base facts
          href: /build/guides/modeling/define-base-facts/

    - id: define-basket-constraints
      title: Define selection and tracking constraints
      explanation: >-
        Stock.x_selected and Stock.x_weight link basket membership to allocation.
        ReturnDate.x_pos_error helps measure tracking gaps while constraints
        enforce the portfolio rules.
      focus:
        file: financial_index_replication.py
        anchors:
          - start: Stock.x_selected = model.Property
            end: ReturnDate.x_neg_error = model.Property
          - start: ").require(weight <= MAX_WEIGHT * selected)"
            end: ").require(weight <= MAX_WEIGHT * selected)"
          - start: index_return - sum(stock_return * weight).per(ReturnDate)
            end: "== pos_error - neg_error"
      references:
        Stock.x_selected:
          symbol: Stock.x_selected
        Stock.x_weight:
          symbol: Stock.x_weight
        ReturnDate.x_pos_error:
          symbol: ReturnDate.x_pos_error
      links:
        - title: Create decision variables
          href: /build/guides/reasoning/prescriptive/decision-problems/variables/
        - title: Add constraints
          href: /build/guides/reasoning/prescriptive/decision-problems/constraints/

    - id: solve-and-inspect-basket
      title: Solve and inspect the basket
      explanation: >-
        si records the solve status. tracking_diff compares the chosen basket
        with the benchmark before the reports are produced.
      focus:
        file: financial_index_replication.py
        anchors:
          - start: problem.solve("highs", time_limit_sec=240)
            end: si = problem.solve_info()
          - start: weights = solution_df.set_index
            end: tracking_diff = portfolio_returns - index_series["index_return"]
      references:
        si:
          symbol: si
        tracking_diff:
          symbol: tracking_diff
      links:
        - title: Solve a decision problem
          href: /build/guides/reasoning/prescriptive/decision-problems/solve/
        - title: Inspect solutions
          href: /build/guides/reasoning/prescriptive/decision-problems/solutions/
