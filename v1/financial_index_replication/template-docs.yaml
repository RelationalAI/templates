          label: define base facts

    - id: define-basket-constraints
      title: Set up stock choices and weights
      explanation: |-
        Once the return history is in the model, the next decisions are which
        stocks to hold and how much to invest in each. Stock.x_selected and
        Stock.x_weight represent those choices in a Problem object created by
        Problem(model, Float).

        The first two problem.solve_for(...) calls create decision variables:
        yes-or-no selection and a weight from 0% to 10% for each stock. The
        monthly tracking fields prepare the model to compare the basket’s
        returns with the index in the next step.
