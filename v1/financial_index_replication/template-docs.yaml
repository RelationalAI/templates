      title: Minimize monthly return gaps
      explanation: |-
        To see how a proposed basket follows the index, the model compares the
        basket’s return with the index return for each sample month.
        problem.satisfy(...) adds constraints that express each difference as
        a positive or negative monthly gap.

        problem.minimize(...) sets an objective that reduces the sum of those
        gaps across the sample months, so the solver favors baskets closer to
        the index. This comparison uses past returns and does not guarantee
        the basket will follow the index as closely in future months.
