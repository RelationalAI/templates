model_explorer:
  title: Explore the model
  description: >-
    Accounts send and receive transactions. The same connections support
    account-level graph signals, transaction-level fraud predictions, and the
    budget-constrained investigation queue.

  concepts:
    - symbol: Account
      description: A customer or merchant account that sends or receives transfers. Its activity and connections to other accounts help the model assess whether a related transfer may be fraudulent.

    - symbol: Transaction
      description: A transfer from one account to another. The model uses its amount and account balances, along with each account’s activity and connections, to estimate whether the transfer may be fraudulent.

  relationships:
    - symbol: Transaction.sender
      label: sent by
      reading: Transaction is sent by Account
      description: Connects each transfer to the account that originated it.

    - symbol: Transaction.receiver
      label: received by
      reading: Transaction is received by Account
      description: Connects each transfer to the account that received it.

  sources:
    - path: data/paysim_mini/accounts.csv
      description: Customer and merchant account identifiers and type prefixes.
      populates:
        - Account

    - path: data/paysim_mini/transactions.csv
      description: Transaction amounts, balances, endpoints, timestamps, and heuristic flags.
      populates:
        - Transaction
        - Transaction.sender
        - Transaction.receiver

    - path: data/paysim_mini/train.csv
      description: Labeled transactions used to train the fraud classifier.
      populates:
        - Transaction

    - path: data/paysim_mini/val.csv
      description: Labeled transactions used to validate the fraud classifier.
      populates:
        - Transaction

    - path: data/paysim_mini/test.csv
      description: Unlabeled transactions scored for investigation.
      populates:
        - Transaction

